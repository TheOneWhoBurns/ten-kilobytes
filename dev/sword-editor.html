<header>

const FRAMES=[[0,0,112,10,0,240,7,0,0,15,1,116,23,0,80,5,0,88],[0,0,112,10,0,240,7,0,0,15,1,116,23,0,80,5,0,24],[0,0,112,10,0,240,7,0,0,15,1,116,23,0,80,5,128,64],[0,0,112,10,0,240,7,0,0,15,192,240,15,0,112,5,0,80],[0,0,112,10,0,240,7,0,0,15,1,120,23,0,112,5,0,88],[0,0,0,0,0,112,10,0,240,7,0,0,7,128,120,5,192,220],[0,0,224,5,0,240,14,0,0,15,2,232,14,128,160,10,1,160],[0,0,224,5,0,240,14,0,0,15,2,232,14,128,160,10,1,128],[0,0,224,5,0,240,14,0,0,15,2,232,14,128,160,26,0,32],[0,0,224,5,0,240,14,0,0,63,0,240,15,0,224,10,0,160],[0,0,224,5,0,240,14,0,0,15,1,232,14,128,224,10,1,160],[0,0,0,0,0,224,5,0,240,14,0,0,30,1,224,58,3,176],[0,0,112,10,128,248,7,0,0,15,129,244,31,65,244,5,0,80],[0,0,112,10,128,248,7,0,0,7,65,244,31,0,80,5,0,16],[0,0,112,10,128,248,7,0,0,7,129,244,31,64,116,5,0,64],[0,0,112,10,128,248,7,0,0,15,0,240,7,0,80,5,0,80],[0,0,112,10,128,248,7,0,0,15,0,240,7,0,112,5,0,80],[0,0,0,0,0,112,10,128,248,7,0,0,11,128,184,3,128,248],[0,0,112,15,128,248,7,0,0,15,1,252,31,192,112,5,0,80],[0,0,112,15,128,248,7,0,0,7,0,244,15,64,112,5,0,64],[0,0,112,15,128,248,7,0,0,7,1,112,23,128,120,13,0,208],[0,0,112,15,192,252,7,0,0,0,128,120,7,0,112,5,0,80],[0,0,112,15,128,248,7,0,0,0,128,248,7,0,112,5,0,80],[0,0,0,0,0,112,15,128,248,7,0,0,15,0,240,15,1,232],[0,0,0,0,64,8,1,0,32,4,5,128,40,3,0,72,0,0],[0,0,0,0,2,0,48,15,255,48,2,0,0,0,0,0,0,0],[0,0,2,0,64,8,1,0,32,12,3,128,24,2,128,112,0,0],[0,0,0,0,0,0,56,15,255,112,0,0,0,0,0,0,0,0]],names=['East','South-east','South','South-west','West','North-west','North','North-east'],$=id=>document.getElementById(id),key='hipocrene-sword-placement-v1',tiles=FRAMES.map((bits,i)=>{const c=document.createElement('canvas');c.width=c.height=12;const g=c.getContext('2d');g.fillStyle=i<24?'#efefdb':i<26?'#a4a5a5':'#c69f27';for(let p=0;p<144;p++)if(bits[p>>3]&(128>>(p&7)))g.fillRect(p%12,p/12|0,1,1);return c;});

const defaults={};for(const pose of ['ready','pullback','strike'])defaults[pose]=names.map((_,i)=>{const a=Math.atan2(Math.sin(i*Math.PI/4),Math.cos(i*Math.PI/4)),c=Math.cos(a),s=Math.sin(a),dir=Math.abs(s)>Math.abs(c)?s>0?2:3:c<0?1:0,hand=dir===1||dir===2?-3:3,grip=pose==='ready'?0:pose==='pullback'?-12:19.2-hand*c-12,lean=pose==='ready'?0:pose==='pullback'?-4:2;return{x:Math.round(hand+grip*c),y:Math.round(-3+grip*s),actorX:Math.round(c*lean),actorY:Math.round(s*lean),angle:pose==='ready'?[-45,-45,-135,-135,-135,-135,-45,-45][i]:i*45,behind:s<-.35||c<-.35||pose==='pullback'&&s>.35,flipX:false,flipY:false,frame:dir*6+(pose==='strike'?3:0)};});

const cards=names.map((name,i)=>{const article=document.createElement('article'),heading=document.createElement('h2'),label=document.createElement('span'),canvas=document.createElement('canvas');heading.append(document.createTextNode(name),label);article.append(heading,canvas);$('cards').append(article);article.addEventListener('pointerdown',()=>{selected=i;controls();draw();});canvas.addEventListener('pointerdown',e=>{if(e.button!==0)return;remember();selected=i;const p=current(),t=$('target').value,point=mouse(e,canvas);drag={canvas,point,x:p[t==='actor'?'actorX':'x'],y:p[t==='actor'?'actorY':'y'],target:t};canvas.setPointerCapture(e.pointerId);e.preventDefault();controls();draw();});canvas.addEventListener('pointermove',e=>{if(!drag||drag.canvas!==canvas)return;const point=mouse(e,canvas),p=current(),snap=$('snap').checked?Math.round:v=>Math.round(v*100)/100;p[drag.target==='actor'?'actorX':'x']=snap(drag.x+point.x-drag.point.x);p[drag.target==='actor'?'actorY':'y']=snap(drag.y+point.y-drag.point.y);save();controls();draw();});const stop=()=>{drag=null;};canvas.addEventListener('pointerup',stop);canvas.addEventListener('pointercancel',stop);return{article,label,canvas};});
function current(){return data[$('pose').value][selected];}
function mouse(e,c){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*48/r.width,y:(e.clientY-r.top)*48/r.height};}
