<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hipocrene · All exits</title><style>
*{box-sizing:border-box}body{margin:0;background:#10151a;color:#eeedde;font:14px monospace}header{padding:18px 24px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}h1{font-size:20px;margin:0}header p{margin:0;color:#a5b3b6}button{background:#27333b;color:inherit;border:1px solid #61716d;padding:7px 12px;font:inherit;cursor:pointer}button:hover{background:#41504d}main{padding:0 24px 24px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}article{border:1px solid #36464b;background:#172127}article>div{display:flex;align-items:center;justify-content:space-between;padding:12px;gap:10px}h2{font-size:15px;margin:0}iframe{width:100%;aspect-ratio:372/252;display:block;border:0}output{display:block;min-height:40px;padding:10px 12px;color:#b7dcaf}aside{display:flex;gap:6px}@media(max-width:750px){main{grid-template-columns:1fr;padding:0 12px 12px}header{padding:16px 12px}}
</style><header><h1>HIPOCRENE / EXITS</h1><p>Five real game exits. Each demo walks into its trigger and reaches Floor 2.</p><button id="replay">Replay all</button></header><main id="exits"></main><script>
const names=['Fountain & puddle','Door of light','Framed portal','Shrine portal','Open ring'],cards=names.map((name,i)=>{const article=document.createElement('article');article.innerHTML=`<div><h2>${i+1}. ${name}</h2><aside><button data-mode="replay">Replay</button><button data-mode="play">Try it</button></aside></div><iframe title="${name}" src="exits-game.html?exit=${i}" allow="autoplay"></iframe><output>Loading…</output>`;document.getElementById('exits').append(article);article.querySelectorAll('button').forEach(b=>b.onclick=()=>article.querySelector('iframe').contentWindow.postMessage({exitDemo:b.dataset.mode},location.origin));return article;});
addEventListener('message',e=>{const i=e.data?.hipocreneExit;if(e.origin!==location.origin||!Number.isInteger(i)||!cards[i]||e.source!==cards[i].querySelector('iframe').contentWindow)return;cards[i].querySelector('output').textContent=e.data.status;});
document.getElementById('replay').onclick=()=>cards.forEach(c=>c.querySelector('button').click());
</script></html>
