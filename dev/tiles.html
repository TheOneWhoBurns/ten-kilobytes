<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Urizen tile selector</title>
<style>
*{box-sizing:border-box}body{background:#101411;color:#e4e5ce;font:14px monospace;margin:12px}a{color:#b5d980}button,input,textarea{font:inherit;background:#202a22;color:inherit;border:1px solid #53664b;padding:6px}header{position:sticky;top:0;background:#101411;padding:4px 0 8px;z-index:1}.bar{display:flex;align-items:center;gap:14px;min-height:36px}h1{font-size:16px;margin:0;white-space:nowrap}#status{font-size:12px;margin:0;flex:1}#toggle{white-space:nowrap;cursor:pointer}#controls{padding-top:8px}.tools{display:flex;align-items:center;gap:16px;flex-wrap:wrap}label{display:flex;align-items:center;gap:8px}#controls p{font-size:12px;margin:8px 0 0;line-height:1.5}canvas{image-rendering:pixelated}#atlas{cursor:crosshair}#sheet{overflow:auto;height:calc(100dvh - var(--header-height,116px) - 24px);min-height:180px;border:1px solid #53664b}textarea{width:100%;height:160px}p{color:#a4b69f}#preview{width:24px;height:24px;flex:none}button:focus-visible,a:focus-visible{outline:2px solid #b5d980;outline-offset:3px}@media(max-width:640px){.bar{flex-wrap:wrap;gap:8px}#status{order:4;flex-basis:100%}#toggle{margin-left:auto}h1{font-size:14px}.tools{gap:10px}}
</style>
<header><div class="bar"><h1>Urizen / tile pantry</h1><canvas id="preview" width="12" height="12" aria-label="Last selected tile"></canvas><p id="status">Loading original sheet…</p><button id="toggle" aria-expanded="true" aria-controls="controls">Hide controls ↑</button></div><div id="controls"><div class="tools"><label>Zoom <input id="zoom" type="range" min="1" max="4" value="2"></label><button id="clear">Clear selection</button><a href="../dist/index.html">Build preview</a><a href="../assets/source/urizen-2bit-free.png">Bonus 2-bit sheet</a></div><p>Click tiles to select · Zero-based coordinates · Copy JSON below into assets/selection.json, then rebuild.</p></div></header>
<div id="sheet"><canvas id="atlas"></canvas></div><p>Selection (development tool; not included in the 10 KB build)</p><textarea id="output" aria-label="Selection JSON" readonly></textarea>
<script>
const im=new Image(),atlas=document.querySelector('#atlas'),ctx=atlas.getContext('2d'),zoom=document.querySelector('#zoom'),output=document.querySelector('#output'),status=document.querySelector('#status'),preview=document.querySelector('#preview').getContext('2d');let selected=[];
function draw(){atlas.width=im.width;atlas.height=im.height;atlas.style.width=im.width*zoom.value+'px';atlas.style.height=im.height*zoom.value+'px';ctx.drawImage(im,0,0);ctx.strokeStyle='#faff00';for(const t of selected)ctx.strokeRect(1+t.x*13+.5,1+t.y*13+.5,11,11);output.value=JSON.stringify({tile_size:12,margin:1,spacing:1,tiles:selected},null,2);status.textContent=selected.length+' selected · '+Math.floor((im.width-1)/13)+' columns · '+Math.floor((im.height-1)/13)+' rows';}
im.onload=draw;im.src='../assets/source/urizen.png';zoom.oninput=()=>{if(im.complete)draw()};
atlas.onclick=e=>{const r=atlas.getBoundingClientRect(),px=(e.clientX-r.left)*atlas.width/r.width,py=(e.clientY-r.top)*atlas.height/r.height,x=Math.floor((px-1)/13),y=Math.floor((py-1)/13);if(x<0||y<0||1+x*13+12>im.width||1+y*13+12>im.height)return;const i=selected.findIndex(t=>t.x===x&&t.y===y);if(i<0)selected.push({name:'tile_'+x+'_'+y,x,y});else selected.splice(i,1);preview.clearRect(0,0,12,12);preview.drawImage(im,1+x*13,1+y*13,12,12,0,0,12,12);draw();status.textContent+=' · last tile '+x+', '+y;};
document.querySelector('#clear').onclick=()=>{selected=[];draw()};
const toggle=document.querySelector('#toggle'),controls=document.querySelector('#controls');
toggle.onclick=()=>{controls.hidden=!controls.hidden;toggle.setAttribute('aria-expanded',String(!controls.hidden));toggle.textContent=controls.hidden?'Show controls ↓':'Hide controls ↑';};
new ResizeObserver(([entry])=>document.documentElement.style.setProperty('--header-height',entry.target.getBoundingClientRect().height+'px')).observe(document.querySelector('header'));
</script></html>
