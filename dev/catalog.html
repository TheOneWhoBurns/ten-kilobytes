<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Urizen · catalogue</title>
<style>*{box-sizing:border-box}body{margin:0;background:#10151d;color:#c8d2de;font:13px system-ui}header{position:sticky;top:0;background:#10151df5;padding:12px 20px;border-bottom:1px solid #33404e;z-index:2;display:flex;gap:16px;align-items:center;flex-wrap:wrap}h1{font-size:16px;margin:0}a{color:#9fd4d2}input,select,button{font:inherit;background:#202b37;color:inherit;border:1px solid #44566c;border-radius:4px;padding:7px}main{padding:20px}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:8px}article{background:#19222c;padding:10px;min-height:125px;border-radius:5px;cursor:pointer}article:hover{background:#283745}canvas{image-rendering:pixelated}small{display:block;color:#93a7bb;font-size:10px;margin-top:6px}#detail{position:fixed;right:0;top:0;bottom:0;background:#18232f;width:min(440px,100%);padding:24px;z-index:3;overflow:auto;box-shadow:0 0 50px #000a}#detail[hidden]{display:none}#detail canvas{background:#080e15;width:144px;height:auto}p{line-height:1.6}#count{color:#93a7bb}#pages{padding:20px;display:flex;gap:15px}#groups{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}#groups button{display:flex;align-items:center;gap:10px}</style>
<header><h1>Urizen / catalogue</h1><a href="tiles.html">Pantry</a><a href="play.html">Play</a><input id="search" type="search" placeholder="Name, family or x,y" aria-label="Search"><select id="category" aria-label="Category"><option value="">All sprites</option></select><select id="quality" aria-label="Evidence"><option value="">All evidence</option><option>exact silhouette match</option><option>visually verified composite</option><option>region classification; individual role inferred</option></select><span id="count"></span></header>
<main><div id="summary"></div><div id="groups"></div><div id="grid"></div><div id="pages"><button id="prev">Previous</button><span id="page"></span><button id="next">Next</button></div></main><aside id="detail" hidden><button id="close">Close</button><h2 id="name"></h2><canvas id="large" width="12" height="12"></canvas><p id="description"></p><pre id="coords"></pre><p id="variants"></p><p id="provenance"></p></aside>
<script>
const $=id=>document.getElementById(id),im=new Image();let data,entries,page=0,active=null;im.src='../assets/source/urizen.png';
function paint(c,x,y,w=1,h=1){c.width=12*w;c.height=12*h;const g=c.getContext('2d');for(let j=0;j<h;j++)for(let i=0;i<w;i++)g.drawImage(im,1+(x+i)*13,1+(y+j)*13,12,12,i*12,j*12,12,12);}
function details(e){active=null;$('detail').hidden=false;$('name').textContent=e.name;paint($('large'),e.x,e.y);$('description').textContent=e.category+' · '+e.family+' · '+e.confidence+(e.runtimeRole?' · In game: '+e.runtimeRole:'')+(e.variantNote?' · '+e.variantNote:'');$('coords').textContent=JSON.stringify({x:e.x,y:e.y},null,2);$('variants').textContent='Exact silhouette variants: '+e.variants.map(id=>{const v=data.entries[id];return v.x+','+v.y}).join(' ')+'\nMirrored matches: '+e.mirroredVariants.length;$('provenance').textContent=e.exact.length?'Creator metadata matches: '+JSON.stringify(e.exact):'Family inferred from atlas region. Review individual equipment/pose before assigning gameplay. '+(e.composite?'Part of '+e.composite+'; use assembled composite.':'');}
function render(){const q=$('search').value.toLowerCase();entries=data.entries.filter(e=>e.kind==='sprite'&&(!$('category').value||e.category===$('category').value)&&(!$('quality').value||e.confidence===$('quality').value)&&(!q||(e.name+' '+e.family+' '+e.category+' '+e.x+','+e.y).toLowerCase().includes(q)));page=Math.min(page,Math.max(0,Math.ceil(entries.length/180)-1));$('grid').replaceChildren();for(const e of entries.slice(page*180,(page+1)*180)){const a=document.createElement('article'),c=document.createElement('canvas'),s=document.createElement('small');paint(c,e.x,e.y);c.style.width='48px';c.style.height='48px';s.textContent=e.x+','+e.y+' · '+e.name;a.append(c,s);a.tabIndex=0;a.setAttribute('role','button');a.onclick=()=>details(e);a.onkeydown=k=>{if(k.key==='Enter')details(e)};$('grid').append(a);}$('count').textContent=entries.length+' sprites';$('page').textContent=(page+1)+' / '+Math.max(1,Math.ceil(entries.length/180));$('prev').disabled=!page;$('next').disabled=(page+1)*180>=entries.length;}
Promise.all([fetch('../assets/catalog/catalog.json').then(r=>r.json()),im.decode()]).then(([d])=>{data=d;for(const v of [...new Set(d.entries.filter(e=>e.kind==='sprite').map(e=>e.category))])$('category').add(new Option(v,v));$('summary').textContent=d.counts.sprites+' sprites · '+d.counts.exactNamed+' exact metadata matches · '+d.counts.uniqueSilhouettes+' unique silhouettes. All 10,300 slots inventoried; region labels remain explicit inferences.';for(const g of [...d.composites,...d.animationGroups]){const b=document.createElement('button'),c=document.createElement('canvas');const [x,y]=g.frames?g.frames[0]:[g.x,g.y];paint(c,x,y,g.w||1,g.h||1);c.style.width=(g.w||1)*24+'px';c.style.height=(g.h||1)*24+'px';b.append(c,document.createTextNode(g.name));b.onclick=()=>{active=g;$('detail').hidden=false;$('name').textContent=g.name;paint($('large'),x,y,g.w||1,g.h||1);$('description').textContent=g.confidence||g.role;$('coords').textContent=JSON.stringify(g,null,2);$('variants').textContent='';$('provenance').textContent='Verified atlas grouping. Assembled without grid gutters.';};$('groups').append(b);}render();});
for(const id of ['search','category','quality'])$(id).oninput=()=>{page=0;render()};$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};$('close').onclick=()=>{active=null;$('detail').hidden=true};setInterval(()=>{if(active?.frames){const f=active.frames[Math.floor(Date.now()/180)%active.frames.length];paint($('large'),...f)}},180);
</script></html>
