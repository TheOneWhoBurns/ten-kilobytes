<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Room zero — development</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d121c;color:#dfdfcf;font:12px monospace;height:100dvh;display:flex;flex-direction:column}header{border-bottom:1px solid #334453;background:#141d29;padding:8px 16px;flex-shrink:0}.bar{display:flex;align-items:center;gap:12px}h1{font-size:13px;letter-spacing:2px;margin:0}#summary{color:#9eb1be;margin-right:auto;font-size:11px}button,input,select{font:inherit;color:inherit;background:#202c3a;border:1px solid #465c70;border-radius:3px;padding:6px 8px}button{cursor:pointer}button:hover{background:#36452a}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #c6e389;outline-offset:2px}button[aria-pressed=true]{background:#4a5933;color:#fff}input[type=number]{width:65px}input[type=range]{width:90px;padding:0;accent-color:#b2cb7d}input[type=checkbox]{accent-color:#b2cb7d}#dev-panel{display:grid;grid-template-columns:1fr 1fr 1.2fr 1.2fr;gap:20px;padding:12px 0 4px;max-height:42vh;overflow:auto}#dev-panel[hidden]{display:none}section{border-left:1px solid #334453;padding-left:16px}section:first-child{border:0;padding-left:0}h2{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:#a5b58e;margin:0 0 10px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px}label{display:inline-flex;align-items:center;gap:6px}.binding{min-width:44px}#seed{width:115px}.hint{color:#8f9d80;font-size:10px;line-height:1.6;margin:6px 0 0}#binding-status{min-height:0;color:#cbdb9e}main{flex:1;min-height:0;display:grid;place-items:center;padding:12px}canvas{image-rendering:pixelated;display:block;outline:none;background:#080a08}canvas:focus-visible{outline:1px solid #a5bd79}a{color:inherit}#info{color:#a4c2d5}@media(max-width:1200px){#dev-panel{grid-template-columns:1fr 1fr}section:nth-child(3){border:0;padding-left:0}}@media(max-width:500px){header{padding:8px}.bar{flex-wrap:wrap}#summary{flex:1}#dev-panel{grid-template-columns:1fr;gap:12px}section{border:0;padding:0}h1{font-size:11px}main{padding:4px}}
#action-status{color:#b8b692;min-width:240px;font-size:10px}.action-tune{display:grid;grid-template-columns:48px minmax(40px,1fr) 48px 18px;gap:6px;align-items:center;margin-bottom:6px}.action-tune input{width:100%}#dev-panel .hint{margin:0}#binding-status:empty{display:none}#run-status,#pickup-status{font-size:10px;line-height:1.5}#run-status{color:#e1e5c9}#pickup-status{color:#a9d0cf;min-height:18px}#action-status{min-width:0}</style>
<header><div class="bar"><h1>ROOM ZERO <span style="color:#9bae7c">/ DEV</span></h1><span id="summary">5 tiles/s</span><button id="pause" aria-pressed="false">Pause</button><button id="dev-toggle" aria-expanded="true" aria-controls="dev-panel">Hide ↑</button></div>
<div id="dev-panel">
<section><h2>Movement</h2><div class="row"><label for="speed">Speed</label><input id="speed-range" aria-label="Speed slider" type="range" min="0.5" max="20" step="0.5" value="5"><input id="speed" aria-label="Character speed" type="number" min="0.5" max="20" step="0.5" value="5"><span>tiles/s</span></div><div class="row"><label><input id="collision" type="checkbox" checked>Wall collision</label><button id="respawn">Reset position</button></div></section>
<section><h2>Controls</h2><div class="row"><label>Layout <select id="layout"><option value="wasd">WASD + arrows</option><option value="arrows">Arrows only</option><option value="ijkl">IJKL</option><option value="custom">Custom</option></select></label></div><div class="row"><button class="binding" id="bind-up" aria-label="Bind move up">W</button><button class="binding" id="bind-left" aria-label="Bind move left">A</button><button class="binding" id="bind-down" aria-label="Bind move down">S</button><button class="binding" id="bind-right" aria-label="Bind move right">D</button><span class="hint">↑ ← ↓ →</span></div><div class="row"><span>Actions</span><button class="binding" id="bind-attack" aria-label="Bind attack">I</button><button class="binding" id="bind-interact" aria-label="Bind interact">O</button><span class="hint"></span></div><p class="hint" id="binding-status" aria-live="polite"></p></section>
<section><h2>Actions</h2>
<div class="action-tune" style="grid-template-columns:72px minmax(40px,1fr) 48px 18px"><span>Attack anim</span><input id="attack-range" aria-label="Attack animation rate slider" type="range" min="0.5" max="30" step="0.5" value="12"><input id="attack-rate" aria-label="Attack animation rate" type="number" min="0.5" max="30" step="0.5" value="12"><span>/s</span></div>
<div class="row"><select id="attack-mode" aria-label="Attack input"><option value="press">Press</option><option value="hold">Hold</option></select><span id="attack-timing" class="hint"></span><label>Base cooldown <input id="attack-cooldown" aria-label="Attack cooldown" type="number" min="0" max="2000" step="10" value="150">ms</label></div>
<div class="action-tune" style="grid-template-columns:72px minmax(40px,1fr) 48px 18px"><span>Pickup anim</span><input id="interact-range" aria-label="Pickup animation rate slider" type="range" min="0.5" max="30" step="0.5" value="12"><input id="interact-rate" aria-label="Pickup animation rate" type="number" min="0.5" max="30" step="0.5" value="12"><span>/s</span></div>
<div class="row"><select id="interact-mode" aria-label="Interact input"><option value="press">Press</option><option value="hold">Hold</option></select><span id="interact-timing" class="hint"></span></div>
<div class="row"><button id="attack">Attack · I</button><button id="interact">Interact · O</button><span id="action-status"></span></div><div id="run-status"></div><div id="pickup-status"></div><span id="control-hint" hidden></span><span id="info"></span></section><section><h2>Room</h2><div class="row"><label>Room <select id="room-select"><option value="-1">Entrance</option><option value="0">1</option><option value="1">2</option><option value="2">3</option><option value="3">4</option><option value="4">5</option><option value="5">6</option><option value="6">Exit</option></select></label><button id="clear-room">Clear room</button></div><div class="row"><label>Enemy <select id="enemy-test" aria-label="Preview enemy"><option value="-1">Choose…</option></select></label><label>Weapon <select id="weapon-test" aria-label="Preview weapon"></select></label><button id="armor-test">+1 armor</button></div><div class="row"><label>Seed <input id="seed" value="1" maxlength="24" spellcheck="false"></label><button id="generate">Generate</button><button id="new">New room ↻</button></div><div class="row"><label>Sprite <button id="prev" aria-label="Previous sprite">‹</button><input id="sprite" type="number" min="104" max="200" value="104" aria-label="Sprite column"><button id="next" aria-label="Next sprite">›</button></label><label><input id="grid" type="checkbox">Grid</label><label><input id="hitbox" type="checkbox">Hitbox</label><button id="defaults">Reset</button></div></section>
</div></header>
<main><canvas id="game" width="372" height="252" tabindex="0" aria-label="Generated room. Move with WASD or arrow keys."></canvas></main>

<script>__CODE__</script></html>
